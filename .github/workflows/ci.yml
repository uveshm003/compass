# CI for GitHub. Mirrors azure-pipelines.yml step for step: GitHub and Azure
# DevOps are both first-class (NF-16), so change the two together.
# tests/test_ci_configs.py fails when their matrices or commands drift apart.
#
# Written to run on a free personal account: no organization features, and
# minutes are spent carefully (public repos are free; private ones get 2,000
# minutes a month, with macOS costing about ten times Linux).
name: ci

on:
  push:
    paths-ignore: ["*.md", "docs/**"]  # root docs, specs and guides; fixture READMEs still run CI
  pull_request:
    paths-ignore: ["*.md", "docs/**"]
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # NF-08: native Windows, no WSL
        python: ["3.11", "3.12"]
        # In a private repo, macOS runs one Python version to save minutes;
        # public repos run the full matrix.
        exclude: ${{ fromJSON(github.event.repository.private && '[{"os":"macos-latest","python":"3.11"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact release tags only (no floating v10), so pin one.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # Exercises the universal-ctags fallback against a real build; the other
      # runners cover it with a stand-in script.
      - name: Install universal-ctags
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y universal-ctags

      - run: uv sync --locked

      - name: Smoke test
        run: uv run compass --help

      # Unit, snapshot and hook-contract tests, plus the latency checks
      # (NF-03, NF-04) on a generated 100k LOC repo.
      - run: uv run pytest --perf
