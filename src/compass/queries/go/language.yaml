name: go
grammar: go
extensions: [.go]
wrappers: [type_declaration, const_declaration, var_declaration, var_spec_list]
index_files: [doc.go]
visibility:
  names:
    - ["^[A-Z]", public]
  default: private
tests:
  files: ["**/*_test.go"]
  name_suffixes: [_test]
  same_package: true         # a _test.go file tests its whole package directory
imports:
  resolver: package          # an import names a directory under a go.mod module path
  module_files:
    go.mod: '^module\s+(\S+)'
