name: kotlin
grammar: kotlin
extensions: [.kt, .kts]
shebangs: [kotlin, kotlinc]
visibility:
  modifiers:
    - ["\\bprivate\\b", private]
    - ["\\bprotected\\b", protected]
    - ["\\binternal\\b", internal]
    - ["\\bpublic\\b", public]
  default: public
tests:
  files: ["**/src/test/**", "**/src/androidTest/**", "**/src/commonTest/**", "**/src/jvmTest/**", "**/src/testFixtures/**", "**/*Test.kt", "**/*Tests.kt", "**/*IT.kt"]
  name_suffixes: [Test, Tests, IT]
imports:
  resolver: module
  separator: "."
  extensions: [.kt]
