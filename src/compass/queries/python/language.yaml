name: python
grammar: python
extensions: [.py, .pyi]
shebangs: [python, python2, python3, pypy, pypy3]
wrappers: [decorated_definition]
skip_before_doc: [decorator]
docstring: body_first_string
index_files: [__init__.py]
visibility:
  names:
    - ["^__.*__$", public]
    - ["^_", private]
  default: public
tests:
  files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
  name_prefixes: [test_]
  name_suffixes: [_test]
imports:
  resolver: module
  separator: "."
  leading_dots: true         # from . import x / from ..pkg import y
  extensions: [.py, .pyi]
  package_files: [__init__.py]
  source_roots: [src]        # src layout: src/ is on the import path
