name: typescript
grammar: typescript
grammar_by_extension:
  .tsx: tsx
extensions: [.ts, .tsx, .mts, .cts]
shebangs: [ts-node, tsx, deno, bun]
wrappers: [export_statement, lexical_declaration, variable_declaration]
skip_before_doc: [decorator]
index_files: [index.ts, index.tsx]
visibility:
  modifiers:
    - ["^private$", private]
    - ["^protected$", protected]
    - ["^public$", public]
  names:
    - ["^#", private]
  exported_by: [export_statement]
  default: public
