name: typescript
grammar: typescript
grammar_by_extension:
  .tsx: tsx
extensions: [.ts, .tsx, .mts, .cts]
shebangs: [ts-node, tsx, deno, bun]
wrappers: [export_statement, lexical_declaration, variable_declaration]
skip_before_doc: [decorator]
index_files: [index.ts, index.tsx]
visibility:
  modifiers:
    - ["^private$", private]
    - ["^protected$", protected]
    - ["^public$", public]
  names:
    - ["^#", private]
  exported_by: [export_statement]
  default: public
tests:
  files: ["**/*.test.*", "**/*.spec.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/e2e/**"]
  name_suffixes: [.test, .spec]
imports:
  resolver: path             # ./ and ../ specifiers; bare ones are packages
  alias_files: [tsconfig.json, jsconfig.json]   # compilerOptions.paths and baseUrl
  extensions: [.ts, .tsx, .d.ts, .mts, .cts, .js, .jsx, .mjs, .cjs]
  extension_aliases:         # ESM style: "./a.js" in TypeScript source means a.ts
    .js: [.ts, .tsx]
    .jsx: [.tsx]
    .mjs: [.mts]
    .cjs: [.cts]
  index_files: [index.ts, index.tsx, index.js, index.jsx]
