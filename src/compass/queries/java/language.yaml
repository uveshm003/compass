name: java
grammar: java
extensions: [.java]
index_files: [package-info.java]
visibility:
  modifiers:
    - ["\\bprivate\\b", private]
    - ["\\bprotected\\b", protected]
    - ["\\bpublic\\b", public]
  default: internal          # package-private
tests:
  files: ["**/src/test/**", "**/src/testFixtures/**", "**/src/integrationTest/**", "**/*Test.java", "**/*Tests.java", "**/*IT.java"]
  name_suffixes: [Test, Tests, IT]
imports:
  resolver: module
  separator: "."
  extensions: [.java]
  package_files: [package-info.java]
