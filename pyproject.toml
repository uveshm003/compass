[project]
name = "compass"
version = "0.1.0"
description = "Code map, prompt gates, delegation and review manifests for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Pinned together: the query API changed across py-tree-sitter releases, and
  # language-pack 0.13.0 is the last release that bundles its grammars in the
  # wheel. 1.x downloads grammars at runtime, which would put network calls on
  # hook paths and break offline machines.
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==0.13.0",
  "pyyaml>=6.0",
]

[project.scripts]
compass = "compass.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The fixture repos contain their own test files; they are data, not tests.
norecursedirs = ["fixtures", "snapshots", ".*", "*.egg", "build", "dist", "node_modules", "venv"]
markers = [
  "perf: latency and throughput checks against a generated 100k LOC repo (enable with --perf)",
]
