[project]
name = "inventory"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic[email]>=2.6",
  "httpx>=0.27 ; python_version >= '3.11'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
